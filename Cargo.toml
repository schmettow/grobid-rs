[package]
name = "grobid"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native Rust client for the GROBID REST API with a strongly typed TEI parser"
license = "MIT"
repository = "https://github.com/schmettow/grobid-rs"
keywords = ["grobid", "tei", "scholarly", "pdf", "bibliography"]
categories = ["science", "text-processing", "web-programming::http-client"]
readme = "README.md"

[dependencies]
biblatex = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
    "multipart",
    "rustls-tls",
] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "time"] }
url = "2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
] }
