[package]
name = "grobid"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "Native Rust client for the GROBID REST API with a strongly typed TEI parser"
license = "MIT"
repository = "https://github.com/schmettow/grobid-rs"
documentation = "https://docs.rs/grobid"
keywords = ["grobid", "tei", "scholarly", "pdf", "bibliography"]
categories = ["science", "text-processing", "web-programming::http-client"]
readme = "README.md"
exclude = ["AGENTS.md"]

[features]
# Second-tier reference completion against OpenAlex. Adds `serde_json` for
# parsing; the requests reuse the existing async reqwest client.
openalex = ["dep:serde_json"]

[dependencies]
biblatex = "0.12"
reqwest = { version = "0.13", default-features = false, features = [
    "form",
    "multipart",
    "rustls",
] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["fs", "time"] }
url = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
] }
